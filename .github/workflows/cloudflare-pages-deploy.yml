name: Build and deploy to Cloudflare Pages

on:
  push:
    branches:
      - master

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          APP_URL: ${{ secrets.APP_URL }}

      - name: Validate Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          node --input-type=module <<'NODE'
          const required = [
            'CLOUDFLARE_API_TOKEN',
            'CLOUDFLARE_ACCOUNT_ID',
            'CLOUDFLARE_PROJECT_NAME',
          ];

          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) {
            console.error(`::error::Missing required GitHub secret(s): ${missing.join(', ')}`);
            process.exit(1);
          }

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const projectName = process.env.CLOUDFLARE_PROJECT_NAME;
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects`,
            {
              headers: {
                Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                'Content-Type': 'application/json',
              },
            },
          );

          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success === false) {
            const messages = (payload.errors || [])
              .map((error) => `${error.code || 'unknown'}: ${error.message}`)
              .join('; ');
            console.error(
              `::error::Unable to list Cloudflare Pages projects for this account/token. ${messages || `HTTP ${response.status}`}`,
            );
            process.exit(1);
          }

          const projects = payload.result || [];
          if (!projects.some((project) => project.name === projectName)) {
            console.error('::error::Cloudflare Pages project not found. Set CLOUDFLARE_PROJECT_NAME to one of the project slugs listed below.');
            console.error('Visible Pages projects:');
            for (const project of projects) {
              console.error(`- ${project.name}`);
            }
            process.exit(1);
          }
          NODE

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: dist
